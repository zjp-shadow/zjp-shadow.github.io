# Site configuration. Jekyll does not reload this file on `jekyll serve`;
# restart the server after editing it.

# Site
locale                   : "en-US"
title                    : "Jiapeng Zhang"
title_separator          : "-"
name                     : "Jiapeng Zhang"
description              : "Ph.D. student at Tsinghua University working on 3D characters, rigging and animation."
url                      : https://zjp-shadow.github.io
baseurl                  : ""
repository               : "zjp-shadow/zjp-shadow.github.io"
future                   : true
timezone                 : Asia/Shanghai
og_image                 : "avatar.jpg"   # link-preview image, in /images/

# Author (used by the homepage hero, footer and SEO tags)
author:
  name                   : "Jiapeng Zhang"
  name_zh                : "张嘉鹏"
  avatar                 : "avatar.webp"
  bio                    : "Ph.D. student @ Tsinghua University. 3D characters, rigging & animation."
  location               : "Beijing, China"
  employer               : "Tsinghua University"
  email                  : "zjp24@mails.tsinghua.edu.cn"
  github                 : "zjp-shadow"
  googlescholar          : "https://scholar.google.com/citations?user=XkE68gcAAAAJ"

# Reading files
include:
  - _pages
exclude:
  - .sass-cache
  - .bundle
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - run.sh
encoding: "utf-8"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: wide
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# HTML compression (_layouts/compress.html)
compress_html:
  clippings: all
  ignore:
    envs: development
