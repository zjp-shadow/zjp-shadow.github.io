- title: "TopoCap: Learning Topology-Agnostic Motion Priors for Monocular Video-to-Animation"
  page: /publications/topocap
  authors: "Cheng-Feng Pu, Jia-Peng Zhang, Meng-Hao Guo, Yan-Pei Cao, Shi-Min Hu"
  venue: "SIGGRAPH 2026 Conference Papers"
  badge: "SIGGRAPH 2026"
  image: /images/publication/topocap-thumb.jpg
  summary: "Captures motion from monocular video and retargets it onto characters with arbitrary, unseen skeletal topologies, from bipeds to hexapods, without test-time optimization."
