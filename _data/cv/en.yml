  - title: "Selected Publications"
    icon: "fas fa-book"
    pubs:
      - title: "SkinTokens: A Learned Compact Representation for Unified Autoregressive Rigging"
        authors: "Jiapeng Zhang, Chengfeng Pu, Menghao Guo, Yan-Pei Cao, Shi-Min Hu"
        venue: "*ACM Transactions on Graphics (TOG)*, 2026, ***Accepted with Minor Revisions***"
        url: "https://zjp-shadow.github.io/works/SkinTokens/"
        desc: "Introduced *SkinTokens*, a learned discrete representation for skinning weights. By framing skinning as a sequence prediction task, the unified *TokenRig* framework jointly models skeletons and skin deformations, achieving substantial improvements in rigorous out-of-distribution geometry evaluations."
      - title: "One Model to Rig Them All: Diverse Skeleton Rigging with UniRig"
        authors: "Jiapeng Zhang, Chengfeng Pu, Menghao Guo, Yan-Pei Cao, Shi-Min Hu"
        venue: "*ACM Transactions on Graphics (TOG)* (***SIGGRAPH 2025***)"
        url: "https://zjp-shadow.github.io/works/UniRig/"
        desc: "Proposed UniRig, a unified framework for automated skeletal rigging leveraging large autoregressive models and a novel *Skeleton Tree Tokenization* method. Trained on *Rig-XL* (a new large-scale dataset), it efficiently generates topologically valid structures, far outperforming existing state-of-the-art tools across diverse generic models."
      - title: "CharacterGen: Efficient 3D Character Generation from Single Images with Multi-View Pose Canonicalization"
        authors: "Haoyang Peng, Jiapeng Zhang, Menghao Guo, Yan-Pei Cao, Shi-Min Hu"
        venue: "*ACM Transactions on Graphics (TOG)* (***SIGGRAPH 2024***), 43(4): 1–13, 2024"
        url: "https://charactergen.github.io/"
        desc: "Presented a highly efficient framework for lifting single images into pose-unified 3D character meshes. It utilizes an image-conditioned multi-view diffusion model for pose calibration and a transformer-based sparse-view network, producing geometrically and texturally robust outputs ready for animation."
      - title: "Transferring the Intelligence of VLMs to Robotic Control"
        authors: "Menghao Guo, Zhehan Mo, Jiajun Wang, Yi Zhang, Kejin Wang, Yixuan Deng, Jiapeng Zhang, Yongming Rao, Shi-Min Hu"
        venue: "*arXiv preprint arXiv:2609.22966*, 2026"
        url: "https://robodawn.top/"
        desc: "Introduced *RoboDawn*, a human-intuitive interface that lets an agentic VLM control robots in a closed loop through discrete translation, rotation and gripper commands, grounded by a few in-context demonstrations. Without task-specific robot training it achieves state-of-the-art success rates on RoboTwin 2.0 C2R and RoboDojo, and transfers to a real Franka arm."

