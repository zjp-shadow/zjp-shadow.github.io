        bullets:
          - "Maintain the official open-source implementations of UniRig (SIGGRAPH 2025, 1.8k+ stars) and SkinTokens (TOG 2026, 450+ stars), distributing unified pre-trained skeleton and skinning models that rig multi-genre meshes, from functional humans to fictional inorganic artifacts."
          - "Released the curated *Rig-XL* dataset and the unified *TokenRig* pipeline that predicts skeletons and skinning weights in a single autoregressive model, enriching the broader 3D automation community."
      - org: "CharacterGen"
        links:
          - { text: "github.com/zjp-shadow/CharacterGen", url: "https://github.com/zjp-shadow/CharacterGen" }
        date: "830+ Stars"
        role: "Project Maintainer & Core Contributor"
        bullets:
          - "Designed and actively maintained the rendering and generation inference tools driving single-image 3D lifting, resolving pose ambiguity with canonical “A-pose” generation."
          - "Open-sourced multi-view diffusion synthesis and detailed texture back-projection, widely adopted by 3D anime avatar creators."
      - org: "Tsinghua Jittor Framework"
        links:
