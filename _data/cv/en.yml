  - title: "Selected Publications"
    pubs:
      - title: "SkinTokens: A Learned Compact Representation for Unified Autoregressive Rigging"
        authors: "Jiapeng Zhang, Chengfeng Pu, Menghao Guo, Yan-Pei Cao, Shi-Min Hu"
        venue: "ACM Transactions on Graphics (TOG), 2026"
        status: "Accepted with Minor Revisions"
        links:
          - { name: "Project", url: "https://zjp-shadow.github.io/works/SkinTokens/" }
          - { name: "arXiv", url: "https://arxiv.org/abs/2602.04805" }
          - { name: "Code", url: "https://github.com/VAST-AI-Research/SkinTokens" }
        desc: "Introduced SkinTokens, a learned discrete representation of skinning weights. By framing skinning as a sequence prediction task, the unified TokenRig framework jointly models skeletons and skin deformations, achieving substantial improvements on rigorous out-of-distribution geometry evaluations."
      - title: "One Model to Rig Them All: Diverse Skeleton Rigging with UniRig"
        authors: "Jiapeng Zhang, Chengfeng Pu, Menghao Guo, Yan-Pei Cao, Shi-Min Hu"
        venue: "ACM Transactions on Graphics (TOG), SIGGRAPH 2025"
        links:
          - { name: "Project", url: "https://zjp-shadow.github.io/works/UniRig/" }
          - { name: "arXiv", url: "https://arxiv.org/abs/2504.12451" }
          - { name: "Code", url: "https://github.com/VAST-AI-Research/UniRig" }
        desc: "Proposed UniRig, a unified framework for automatic skeletal rigging built on a large autoregressive model and a novel Skeleton Tree Tokenization. Trained on Rig-XL, a new large-scale dataset, it efficiently generates topologically valid skeletons and far outperforms existing state-of-the-art tools across diverse models."
      - title: "CharacterGen: Efficient 3D Character Generation from Single Images with Multi-View Pose Canonicalization"
        authors: "Haoyang Peng, Jiapeng Zhang, Menghao Guo, Yan-Pei Cao, Shi-Min Hu"
        venue: "ACM Transactions on Graphics (TOG), SIGGRAPH 2024, 43(4): 1–13"
        links:
          - { name: "Project", url: "https://charactergen.github.io/" }
          - { name: "arXiv", url: "https://arxiv.org/abs/2402.17214" }
          - { name: "Code", url: "https://github.com/zjp-shadow/CharacterGen" }
        desc: "Presented an efficient framework that lifts a single image into a pose-canonicalized 3D character mesh. It combines an image-conditioned multi-view diffusion model for pose calibration with a transformer-based sparse-view reconstruction network, producing geometrically and texturally robust results ready for animation."
      - title: "Transferring the Intelligence of VLMs to Robotic Control"
        authors: "Menghao Guo, Zhehan Mo, Jiajun Wang, Yi Zhang, Kejin Wang, Yixuan Deng, Jiapeng Zhang, Yongming Rao, Shi-Min Hu"
        venue: "arXiv preprint arXiv:2609.22966, 2026"
        links:
          - { name: "Project", url: "https://robodawn.top/" }
          - { name: "arXiv", url: "https://arxiv.org/abs/2609.22966" }
        desc: "Introduced RoboDawn, a human-intuitive interface that lets an agentic VLM control robots in a closed loop through discrete translation, rotation and gripper commands, grounded by a few in-context demonstrations. Without task-specific robot training it reaches state-of-the-art success rates on RoboTwin 2.0 C2R and RoboDojo, and transfers to a real Franka arm."

