          - { text: "JittorInfer", url: "https://github.com/Jittor/JittorInfer" }
        date: "3200+ Stars"
        role: "Core Member & Head of JittorInfer Framework"
        bullets:
          - "Engineered **JittorInfer**, a high-performance C++ LLM inference framework adapted to domestic AI hardware such as Huawei Ascend processors."
          - "Spearheaded system-level computing abstractions, including CPU multi-stage operator fusion and end-to-end resource execution scheduling, which brought large throughput improvements when serving frontier models like the **DeepSeek** lineup compared to Ascend-vLLM."

