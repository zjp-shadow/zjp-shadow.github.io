{% include base_path %}

<div class="site-footer">
  <div class="site-footer__links">
    {% if site.author.email %}<a href="mailto:{{ site.author.email }}" aria-label="Email" title="Email"><i class="fas fa-envelope" aria-hidden="true"></i></a>{% endif %}
    {% if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}" aria-label="Google Scholar" title="Google Scholar"><i class="fas fa-graduation-cap" aria-hidden="true"></i></a>{% endif %}
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}" aria-label="GitHub" title="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>{% endif %}
    <a href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" aria-label="RSS feed" title="RSS feed"><i class="fas fa-rss" aria-hidden="true"></i></a>
  </div>
  <div class="site-footer__copy">
    &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }} &middot; Built with <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a>, based on <a href="https://github.com/academicpages/academicpages.github.io" rel="nofollow">AcademicPages</a>
  </div>
</div>

<button class="back-to-top" type="button" aria-label="Back to top" title="Back to top"><i class="fas fa-arrow-up" aria-hidden="true"></i></button>
